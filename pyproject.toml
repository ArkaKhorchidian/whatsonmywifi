[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "whatsonmywifi"
version = "0.1.0"
description = "Every device on your WiFi, what it is, and what it gives away. No root needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13", "netaddr>=0.10"]
keywords = ["wifi", "network", "privacy", "iot", "smart-home", "mdns", "upnp", "arp", "security", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Networking",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
whatsonmywifi = "whatsonmywifi.cli:main"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/whatsonmywifi"
Issues = "https://github.com/ArkaKhorchidian/whatsonmywifi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsonmywifi"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
